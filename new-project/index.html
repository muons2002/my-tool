    <style>
        :root {
            --bg-color: #0a0b0e;
            --card-bg: #14161f;
            --text-color: #ffffff;
            --accent-color: #00c6ff;
            --accent-hover: #0072ff;
            --border-color: #202433;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 24px;
        }

        header p {
            color: #8a90a3;
            font-size: 14px;
            margin: 0;
        }

        .player-container {
            max-width: 950px;
            margin: 0 auto 25px auto;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 12px 35px rgba(0,0,0,0.95);
        }

        video {
            width: 100%;
            max-height: 500px;
            background: #000;
            display: block;
        }

        .search-container {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }

        #searchInput {
            width: 100%;
            max-width: 550px;
            padding: 12px 20px;
            font-size: 15px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.2);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .media-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            border-color: var(--accent-color);
        }

        .media-info h3 {
            font-size: 15px;
            margin: 0 0 12px 0;
            color: #fff;
            text-align: right;
            line-height: 1.4;
        }

        .badges {
            display: flex;
            gap: 6px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .badge-cat {
            background-color: #1a1e2d;
            color: #00c6ff;
            border: 1px solid #282f45;
        }

        .badge-quality {
            background-color: #065f46;
            color: #a7f3d0;
        }

        .play-btn {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            width: 100%;
            transition: opacity 0.2s, transform 0.1s;
        }

        .play-btn:hover {
            opacity: 0.9;
        }

        .play-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>

        function detectQuality(item) {
            let text = (item.name + " " + item.group).toUpperCase();
            if (text.includes("4K") || text.includes("⁴ᴷ")) return "4K";
            if (text.includes("FHD") || text.includes("¹⁰⁸⁰") || text.includes("1080")) return "FHD";
            if (text.includes("HD") || text.includes("ᴴᴰ") || text.includes("720")) return "HD";
            if (text.includes("SD") || text.includes("ˢᴰ")) return "SD";
            if (item.url.endsWith(".mkv")) return "MKV";
            if (item.url.endsWith(".mp4")) return "MP4";
            if (item.url.endsWith(".avi")) return "AVI";
            return "HD";
        }

        function renderMedia(data) {
            const container = document.getElementById("mediaContainer");
            container.innerHTML = "";

            if (data.length === 0) {
                container.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color: #8a90a3;'>لا توجد نتائج مطابقة لبحثك.</p>";
                return;
            }

            data.forEach(item => {
                const quality = detectQuality(item);
                const card = document.createElement("div");
                card.className = "media-card";
                
                card.innerHTML = `
                    <div class="media-info">
                        <div class="badges">
                            <span class="badge badge-quality">${quality}</span>
                            <span class="badge badge-cat">${item.group}</span>
                        </div>
                        <h3>${item.name}</h3>
                    </div>
                    <button class="play-btn" onclick="playMedia('${item.url}')">تشغيل الآن</button>
                `;
                container.appendChild(card);
            });
        }

        function playMedia(url) {
            const player = document.getElementById("videoPlayer");
            player.src = url;
            player.play().catch(e => console.log(e));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterMedia() {
            const query = document.getElementById("searchInput").value.toLowerCase();
            const filtered = rawPlaylist.filter(item => 
                item.name.toLowerCase().includes(query) || 
                item.group.toLowerCase().includes(query) ||
                detectQuality(item).toLowerCase().includes(query)
            );
            renderMedia(filtered);
        }

        window.onload = () => {
            renderMedia(rawPlaylist);
            if (rawPlaylist.length > 0) {
                const player = document.getElementById("videoPlayer");
                player.src = rawPlaylist[0].url;
            }
        };
    </script>
