<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جنود الخفاء - Dynamic Cinema Packages</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #08090c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #12141d;
            padding: 12px 20px;
            border-radius: 12px;
            border: 1px solid #1f2435;
            flex-wrap: wrap;
            gap: 10px;
        }
        .brand-title {
            font-size: 17px;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brand-badge {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: #fff;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn-action {
            background: #1a1e2d;
            border: 1px solid #282f45;
            color: #00c6ff;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            text-decoration: none;
        }
        .btn-action:hover {
            background: #0072ff;
            color: #fff;
            border-color: #0072ff;
        }

        .player-section {
            background: #000;
            border-radius: 14px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 12px 35px rgba(0,0,0,0.95);
            border: 1px solid #1f2435;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #00c6ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
            z-index: 10;
        }
        @keyframes spin {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        .drawer-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .drawer-content {
            position: fixed;
            top: 0;
            right: -380px;
            width: 380px;
            height: 100%;
            background: #0d0f17;
            border-left: 1px solid #1f2435;
            z-index: 1000000;
            display: flex;
            flex-direction: column;
            transition: right 0.3s ease;
            box-shadow: -10px 0 30px rgba(0,0,0,0.9);
        }
        .drawer-overlay.open .drawer-content { right: 0; }

        .drawer-header {
            padding: 15px 20px;
            background: #141722;
            border-bottom: 1px solid #1f2435;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .drawer-title { font-size: 15px; font-weight: bold; color: #fff; }
        .close-btn {
            background: none;
            border: none;
            color: #8a90a3;
            font-size: 18px;
            cursor: pointer;
        }

        .drawer-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
            overflow-y: auto;
        }

        .search-box {
            background: #151824;
            border: 1px solid #22283d;
            color: #fff;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            width: 100%;
        }

        .package-group {
            margin-bottom: 10px;
            border: 1px solid #1f2435;
            border-radius: 8px;
            overflow: hidden;
            background: #11141d;
        }
        .package-header {
            padding: 12px 15px;
            background: #171a26;
            color: #00c6ff;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .package-count {
            background: #0072ff;
            color: #fff;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
        }
        .package-items {
            list-style: none;
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 8px;
            background: #0e1017;
        }
        .package-group.active .package-items { display: flex; }

        .channel-item {
            padding: 9px 12px;
            background: #151823;
            border: 1px solid #1b2130;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .channel-item:hover { background: #1f2538; border-color: #00c6ff; }
        .channel-item.active { background: #0072ff; color: #fff; font-weight: bold; }
        .channel-name { font-size: 12px; }

        .player-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #12141d;
            border-radius: 12px;
            border: 1px solid #1f2435;
            font-size: 13px;
        }
        .live-status { display: flex; align-items: center; gap: 8px; color: #00c6ff; font-weight: bold; }
        .red-dot {
            width: 8px; height: 8px;
            background-color: #00c6ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00c6ff;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="app-header">
            <div class="brand-title">
                <span class="brand-badge">DYNAMIC</span>
                <span id="current-channel-title">جنود الخفاء - اختر عرضاً</span>
            </div>
            
            <div class="header-controls">
                <a class="btn-action" id="externalBtn" href="#" target="_blank" rel="noopener noreferrer">
                    <span>🚀</span>
                    <span>تشغيل خارجي / VLC</span>
                </a>
                <button class="btn-action" onclick="toggleFullScreen()">
                    <span>⛶</span>
                    <span>تكبير</span>
                </button>
                <button class="btn-action" onclick="toggleDrawer(true)">
                    <span>☰</span>
                    <span>إدارة الباقات</span>
                </button>
            </div>
        </div>

        <div class="player-section" id="playerSection">
            <div class="video-wrapper">
                <div class="loading-spinner" id="spinner"></div>
                <video id="video" controls autoplay></video>
            </div>
        </div>

        <div class="player-footer">
            <div class="live-status"><span class="red-dot"></span> النظام الديناميكي نشط</div>
            <div style="color: #8a90a3;">تطوير: <span style="color: #00c6ff;">جنود الخفاء</span></div>
        </div>
    </div>

    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer(false)">
        <div class="drawer-content" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <span class="drawer-title">باقات العرض الديناميكية</span>
                <button class="close-btn" onclick="toggleDrawer(false)">✕</button>
            </div>
            <div class="drawer-body">
                <input type="text" id="searchInput" class="search-box" placeholder="ابحث في جميع الباقات..." onkeyup="handleSearch()">
                <div id="dynamicPackagesContainer"></div>
            </div>
        </div>
    </div>

    <script>
        var fullPlaylist = [
            { name: "آه يا درب الزلق", group: "🎭 باقة المسرحيات العربية", url: "http://mysql360.life:2095/movie/METRkaytBD/vstdwBOjCx/137517.mkv" },
            { name: "بو سارة في العمارة", group: "🎭 باقة المسرحيات العربية", url: "http://mysql360.life:2095/movie/METRkaytBD/vstdwBOjCx/137518.mp4" },
            { name: "عالمكشوف", group: "🎭 باقة المسرحيات العربية", url: "http://mysql360.life:2095/movie/METRkaytBD/vstdwBOjCx/137519.mkv" },
            { name: "عوكل", group: "🎬 باقة الأفلام العربية", url: "http://mysql360.life:2095/movie/METRkaytBD/vstdwBOjCx/143201.mp4" },
            { name: "أيام السادات", group: "🎬 باقة الأفلام العربية", url: "http://mysql360.life:2095/movie/METRkaytBD/vstdwBOjCx/143200.mp4" }
        ];

        var video = document.getElementById('video');
        var playerSection = document.getElementById('playerSection');
        var spinner = document.getElementById('spinner');
        var externalBtn = document.getElementById('externalBtn');
        var hlsPlayer = null;
        var currentGlobalIndex = 0;

        video.addEventListener('waiting', function() { spinner.style.display = 'block'; });
        video.addEventListener('playing', function() { spinner.style.display = 'none'; });

        function toggleFullScreen() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (playerSection.requestFullscreen) { playerSection.requestFullscreen(); }
                else if (playerSection.webkitRequestFullscreen) { playerSection.webkitRequestFullscreen(); }
            } else {
                if (document.exitFullscreen) { document.exitFullscreen(); }
                else if (document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            }
        }

        function toggleDrawer(open) {
            var overlay = document.getElementById('drawerOverlay');
            if (open) { overlay.classList.add('open'); }
            else { overlay.classList.remove('open'); }
        }

        function renderDynamicPackages(data) {
            var container = document.getElementById('dynamicPackagesContainer');
            container.innerHTML = '';
            var groups = {};
            data.forEach(function(item, originalIndex) {
                if (!groups[item.group]) { groups[item.group] = []; }
                groups[item.group].push({ item: item, index: originalIndex });
            });

            for (var groupName in groups) {
                var groupDiv = document.createElement('div');
                groupDiv.className = 'package-group';
                var header = document.createElement('div');
                header.className = 'package-header';
                header.innerHTML = `<span>${groupName}</span> <span class="package-count">${groups[groupName].length}</span>`;
                header.onclick = function() { this.parentElement.classList.toggle('active'); };
                groupDiv.appendChild(header);

                var ul = document.createElement('ul');
                ul.className = 'package-items';
                groups[groupName].forEach(function(obj) {
                    var ch = obj.item;
                    var idx = obj.index;
                    var li = document.createElement('li');
                    li.className = 'channel-item' + (idx === currentGlobalIndex ? ' active' : '');
                    li.onclick = function() {
                        selectMedia(idx);
                        toggleDrawer(false);
                    };
                    li.innerHTML = `<span class="channel-name">${ch.name}</span>`;
                    ul.appendChild(li);
                });
                groupDiv.appendChild(ul);
                container.appendChild(groupDiv);
            }
        }

        function selectMedia(index) {
            currentGlobalIndex = index;
            var item = fullPlaylist[index];
            document.getElementById('current-channel-title').innerText = 'جنود الخفاء - ' + item.name;
            externalBtn.href = item.url;
            renderDynamicPackages(fullPlaylist);
            playStream(item.url);
        }

        function handleSearch() {
            var query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) { renderDynamicPackages(fullPlaylist); return; }
            var filtered = fullPlaylist.filter(function(c) {
                return c.name.toLowerCase().includes(query) || c.group.toLowerCase().includes(query);
            });
            renderDynamicPackages(filtered);
        }

        function playStream(url) {
            spinner.style.display = 'block';
            if (url.endsWith('.m3u8') && Hls.isSupported()) {
                if (hlsPlayer) { hlsPlayer.destroy(); }
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
            } else {
                if (hlsPlayer) { hlsPlayer.destroy(); }
                video.src = url;
                video.load();
                video.play().catch(e => console.log("Blocked by browser HTTPS policy:", e));
            }
        }

        renderDynamicPackages(fullPlaylist);
        selectMedia(0);
    </script>
</body>
</html>
